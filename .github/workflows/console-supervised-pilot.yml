name: Supervised pilot console
on:
  push:
    branches: [ci/console-supervised-pilot]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eugenevivino/openrvdas
          ref: 8652862ac590334840f6be1518befe6a9c69c0dd
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare replay and browser
        run: |
          python -m pip install -r utils/requirements.txt 'paho-mqtt<2' pytest==9.2.0 playwright==1.64.1 websockets==17.4 flake8==7.5.0
          python -m playwright install --with-deps chromium
      - name: Exercise shipped console and replay directory
        run: |
          test "$(git rev-parse HEAD)" = 8652862ac590334840f6be1518befe6a9c69c0dd
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test --junitxml="$RUNNER_TEMP/pilot-tests.xml"
          python -c 'import sys,xml.etree.ElementTree as ET; cases=[c for c in ET.parse(sys.argv[1]).iter("testcase") if c.get("classname","").endswith("test_pilot_modules_browser")]; print([c.get("name") for c in cases]); assert len(cases)==10 and all(c.find("skipped") is None for c in cases)' "$RUNNER_TEMP/pilot-tests.xml"
      - name: Confirm source loss and recovery across fresh fixture startups
        run: |
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test/console/test_source_loss_browser.py
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test/console/test_source_loss_browser.py
