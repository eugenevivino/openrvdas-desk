name: Supervised pilot console
on:
  push:
    branches: [ci/relay-console-20261120]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eugenevivino/openrvdas
          ref: 5b892601f7c6f224c279714ae8edbf0e619c740b
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare replay and browser
        run: |
          python -m pip install -r utils/requirements.txt 'paho-mqtt<2' pytest==9.2.0 playwright==1.64.1 websockets==17.4 flake8==7.5.0
          python -m playwright install --with-deps chromium
      - name: Exercise shipped console and replay directory
        run: |
          test "$(git rev-parse HEAD)" = 5b892601f7c6f224c279714ae8edbf0e619c740b
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test contrib/deepsignal/console/install/test_nginx_site.py::test_readme_routes_initial_setup_through_the_relay_gate --junitxml="$RUNNER_TEMP/pilot-tests.xml"
          python -c 'import sys,xml.etree.ElementTree as ET; cases=[c for c in ET.parse(sys.argv[1]).iter("testcase") if c.get("classname","").endswith("test_pilot_modules_browser")]; print([c.get("name") for c in cases]); assert len(cases)==10 and all(c.find("skipped") is None for c in cases)' "$RUNNER_TEMP/pilot-tests.xml"
      - name: Confirm source loss and recovery across fresh fixture startups
        run: |
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test/console/test_source_loss_browser.py
          python -m pytest -p no:cacheprovider -v contrib/deepsignal/test/console/test_source_loss_browser.py
      - name: Run the documented Weather demo over HTTP and HTTPS
        run: |
          if ! command -v nginx >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q nginx; fi
          python - <<'PYDEMO'
          """Exercise the shipped Weather page with the documented demo cache and read-only gateway."""
          from argparse import Namespace
          from contextlib import ExitStack
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          from playwright.sync_api import expect, sync_playwright
          from contrib.deepsignal.security.nginx.render_site import render_site


          def owned_process(stack, directory, name, command):
              log = stack.enter_context((directory / (name + ".log")).open("wb"))
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT)
              def stop():
                  if process.poll() is None:
                      process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
              stack.callback(stop)
              return process


          def main():
              directory = Path(os.environ["RUNNER_TEMP"]) / "pilot-demo"
              directory.mkdir()
              certificate, key = directory / "demo.crt", directory / "demo.key"
              subprocess.run(["openssl", "req", "-x509", "-newkey", "rsa:2048", "-nodes", "-days", "1",
                              "-subj", "/CN=localhost", "-keyout", key, "-out", certificate],
                             check=True, stderr=subprocess.DEVNULL)
              endpoints = [("http", 18880), ("https", 18881)]
              sites = []
              for scheme, port in endpoints:
                  tls = scheme == "https"
                  site = render_site(Namespace(origin=[f"{scheme}://localhost:{port}"],
                      ssl_certificate=str(certificate) if tls else None, ssl_certificate_key=str(key) if tls else None,
                      openrvdas_root=str(Path.cwd())))
                  # Keep the unprivileged CI server on loopback for this isolated demo.
                  needle = f"listen {port}"
                  original = site.contents.decode()
                  assert original.count(needle) == 1
                  sites.append(original.replace(needle, f"listen 127.0.0.1:{port}"))
              config = directory / "nginx.conf"
              temps = " ".join(f"{kind}_temp_path {directory}/{kind};" for kind in
                               ("client_body", "proxy", "fastcgi", "uwsgi", "scgi"))
              config.write_text(f"pid {directory}/nginx.pid; error_log stderr; events {{}} http {{ access_log off; {temps} "
                                + "\n".join(sites) + "\n}")
              with ExitStack() as stack:
                  processes = [
                      owned_process(stack, directory, "cache", [sys.executable, "-u", "-m", "contrib.deepsignal.console.demo_cache",
                          "contrib/deepsignal/configs/console_demo_logger.yaml"]),
                      owned_process(stack, directory, "gateway", [sys.executable, "-m", "contrib.deepsignal.security.cds_gateway",
                          "--upstream", "ws://127.0.0.1:18766"]),
                      owned_process(stack, directory, "nginx", [shutil.which("nginx") or "/usr/sbin/nginx", "-p", str(directory),
                          "-c", str(config), "-g", "daemon off;"]),
                  ]
                  subprocess.run(["curl", "--silent", "--show-error", "--fail", "--retry", "8", "--retry-connrefused",
                                  "--retry-delay", "1", "--output", os.devnull, "http://localhost:18880/console/"], check=True)
                  with sync_playwright() as driver:
                      browser = driver.chromium.launch()
                      for scheme, port in endpoints:
                          page = browser.new_page(ignore_https_errors=scheme == "https")
                          connections = []
                          page.on("websocket", lambda ws: connections.append(ws.url))
                          page.goto(f"{scheme}://localhost:{port}/console/")
                          for label, units in [("Air temperature", "°C"), ("Relative humidity", "%")]:
                              tile = page.locator(".tile").filter(has=page.get_by_role("heading", name=label, exact=True))
                              expect(tile.locator(".value")).to_have_text(re.compile(r"-?\d+(?:\.\d+)?\s*" + units), timeout=30000)
                              expect(tile.get_by_role("group", name="Freshness")).to_have_text("LIVE", timeout=10000)
                          ws_scheme = "wss" if scheme == "https" else "ws"
                          assert connections and set(connections) == {f"{ws_scheme}://localhost:{port}/cds-ws"}, connections
                          assert all(p.poll() is None for p in processes)
                          print(scheme.upper(), "PASS Weather temperature and humidity LIVE over", connections[-1], flush=True)
                          page.close()
                      browser.close()


          if __name__ == "__main__":
              main()
          PYDEMO
  hardening:
    defaults:
      run:
        working-directory: product
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          repository: eugenevivino/openrvdas
          ref: 5b892601f7c6f224c279714ae8edbf0e619c740b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: desk
          ref: 460914c40ec02ddb8509be1994d5642174937469
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated Linux tools
        run: |
          test "$(git rev-parse HEAD)" = 5b892601f7c6f224c279714ae8edbf0e619c740b
          sudo apt-get update -q
          sudo apt-get install -y -q supervisor nginx iproute2
          python -m pip install -q -r utils/requirements.txt 'paho-mqtt<2' pytest==9.2.0 websockets==17.4 bandit==1.9.4
      - name: Verify packaged executable locations
        run: |
          command -v ss supervisorctl nginx systemctl ps
      - name: Read the running Supervisor fixture PID and environment
        run: |
          scratch="$RUNNER_TEMP/pilot-supervisor"
          mkdir -p "$scratch"
          cat > "$scratch/supervisord.conf" <<CONF
          [unix_http_server]
          file=$scratch/control.sock
          [supervisorctl]
          serverurl=unix://$scratch/control.sock
          [supervisord]
          logfile=$scratch/daemon.log
          pidfile=$scratch/daemon.pid
          childlogdir=$scratch
          [rpcinterface:supervisor]
          supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
          [program:cached_data_server]
          command=/bin/sleep 90
          environment=CDS_UDP_PORTS="6225",CDS_UDP_INTERFACE="127.0.0.1"
          autostart=false
          startsecs=0
          CONF
          sudo unshare --mount --net --propagation private -- /bin/bash -eu -c '
            mount --bind "$1/supervisord.conf" /etc/supervisor/supervisord.conf
            /usr/bin/supervisord -c "$1/supervisord.conf"
            trap "/usr/bin/supervisorctl shutdown" EXIT
            /usr/bin/supervisorctl start cached_data_server
            "$2" -c "from contrib.deepsignal.security.probe_cds import supervisor_environment; actual=supervisor_environment(); assert actual == dict(CDS_UDP_PORTS=\"6225\", CDS_UDP_INTERFACE=\"127.0.0.1\"), actual; print(\"PASS running Supervisor PID and filtered fixture environment\")"
          ' pilot "$scratch" "$(command -v python)"
      - name: Run security and installer suites
        run: |
          python -m pytest -q contrib/deepsignal/test/security contrib/deepsignal/console/install contrib/deepsignal/test/console/test_install.py test/server/test_cached_data_server_host.py -k 'not real_197'
      - name: Verify both real nginx configurations
        run: |
          python -m pytest -v contrib/deepsignal/console/install/test_nginx_site.py -k real_197
      - name: Verify raw Bandit and approved policy for this commit
        run: |
          mkdir "$RUNNER_TEMP/pilot-scan"
          python -I -B ../desk/tools/fast-review/bandit-policy.py "$(command -v python)" "$PWD" 5b892601f7c6f224c279714ae8edbf0e619c740b "$RUNNER_TEMP/pilot-scan"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"]) / "pilot-scan"
          raw = json.loads((d / "bandit-raw-5b892601f7c6f224c279714ae8edbf0e619c740b.json").read_text())
          decision = json.loads((d / "bandit-policy-5b892601f7c6f224c279714ae8edbf0e619c740b.json").read_text())
          assert raw["candidate_head"] == decision["candidate_head"] == "5b892601f7c6f224c279714ae8edbf0e619c740b"
          assert raw["run_id"] == decision["run_id"]
          assert raw["exit_status"] == 1 and decision["finding_count"] == 188 and decision["verdict"] == "PASS"
          print("Verified raw 188 and policy PASS for 5b892601f7c6f224c279714ae8edbf0e619c740b")
          PYTHON
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eugenevivino/openrvdas
          ref: 5b892601f7c6f224c279714ae8edbf0e619c740b
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and test the production console with one worker
        working-directory: contrib/deepsignal/console
        run: |
          test "$(git rev-parse HEAD)" = 5b892601f7c6f224c279714ae8edbf0e619c740b
          npm ci --no-audit --no-fund
          npm run lint
          npm run type-check
          npm run build
          npm test -- --maxWorkers=1 --no-file-parallelism
