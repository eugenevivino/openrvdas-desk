name: Pilot cloud verification
run-name: Pilot cloud verification (${{ github.ref }})
on:
  push:
    tags: ['cloud-verification/v1/*']

permissions:
  contents: read

jobs:
  pilot:
    if: github.repository == 'eugenevivino/openrvdas-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve pins
        id: request
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/cloud-verification/v1/([0-9a-f]{40})-([0-9a-f]{40})$ ]]; then
            exit 1
          fi
          test "${BASH_REMATCH[2]}" = "$GITHUB_SHA"
          printf 'product_sha=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: eugenevivino/openrvdas
          ref: ${{ steps.request.outputs.product_sha }}
          persist-credentials: false
      - name: pin
        env:
          PRODUCT_SHA: ${{ steps.request.outputs.product_sha }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: dependencies
        id: dependencies
        working-directory: contrib/deepsignal/console
        run: npm ci --no-audit --no-fund
      - name: console-tests
        working-directory: contrib/deepsignal/console
        run: npm test
      - name: console-types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: contrib/deepsignal/console
        run: npm run type-check
