name: Stream Health view
on:
  push:
    branches: [ci/stream-health-view]
permissions:
  contents: read
jobs:
  view:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eugenevivino/openrvdas
          ref: 33fbc6fb9399353e64dd1f1378789e5d702d4a85
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and test shipped console
        working-directory: contrib/deepsignal/console
        run: |
          test "$(git rev-parse HEAD)" = 33fbc6fb9399353e64dd1f1378789e5d702d4a85
          npm ci --no-audit --no-fund
          npm run lint
          npm run type-check
          npm test
          npm run build
      - name: Run Stream Health in Chromium
        env:
          STREAM_HEALTH_TESTED_COMMIT: 33fbc6fb9399353e64dd1f1378789e5d702d4a85
        run: |
          python -m pip install -q -r utils/requirements.txt 'paho-mqtt<2' pytest==9.2.0 playwright==1.64.1 websockets==17.4
          python -m playwright install --with-deps chromium
          python -m pytest -v contrib/deepsignal/test/console/test_stream_health_view_browser.py --junitxml="$RUNNER_TEMP/view.xml"
          python -c 'import sys,xml.etree.ElementTree as ET; cases=list(ET.parse(sys.argv[1]).iter("testcase")); assert cases and all(all(c.find(k) is None for k in ("skipped","error","failure")) for c in cases); print("Browser tests passed",len(cases))' "$RUNNER_TEMP/view.xml"
