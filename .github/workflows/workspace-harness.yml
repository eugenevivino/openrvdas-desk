name: DeepSignal bounded workspace harness checks
on:
  push:
    branches: [ci/workspace-harness-20261121]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  affected-harness-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eugenevivino/openrvdas
          ref: ce22f377f29c9bf5ba444a463d7a355c44adec61
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated pinned fixture dependencies
        run: |
          test "$(git rev-parse HEAD)" = ce22f377f29c9bf5ba444a463d7a355c44adec61
          python -m pip install -r contrib/deepsignal/workspace/requirements-lock.txt playwright==1.64.1
          python -m playwright install --with-deps chromium
          python -m pip freeze > "$RUNNER_TEMP/workspace-dependencies.txt"
      - name: Shared services and HTTP boundaries
        run: python -B -m unittest discover -s contrib/deepsignal/workspace/tests -v
      - name: Actual official SDK stdio workflow
        run: python -B -m contrib.deepsignal.workspace.mcp_smoke --state "$RUNNER_TEMP/workspace-mcp.sqlite3"
      - name: Ordinary model-free CLI workflow
        run: python -B -m contrib.deepsignal.workspace --state "$RUNNER_TEMP/workspace-cli.sqlite3" demo > "$RUNNER_TEMP/workspace-handoff.json"
      - name: Verify unchanged frontend and bounded workspace change scope
        run: |
          git fetch --no-tags --depth=1 origin 58fbde8cb9cbab0b4a77ee25042fd9a9169d4615
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          base = '58fbde8cb9cbab0b4a77ee25042fd9a9169d4615'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          allowed = {'contrib/deepsignal/workspace/' + name for name in (
              'browser_smoke.py', 'mcp_smoke.py', 'mcp_server.py', 'service.py',
              'tests/test_mcp_smoke.py', 'tests/test_mcp_access.py',
              'DEMO-STORIES.md', 'MCP.md', 'PROGRESS.md', 'README.md')}
          if not changed <= allowed:
              raise SystemExit('Changed scope exceeds retained evidence: ' + repr(sorted(changed - allowed)))
          tree = lambda rev: subprocess.check_output(['git', 'rev-parse', rev + ':contrib/deepsignal/console'], text=True).strip()
          if tree(base) != tree('HEAD'):
              raise SystemExit('Frontend evidence cannot be reused')
          result = {'candidate': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'base': base, 'frontend_tree': tree(base), 'prior_linux_run': 44879804326,
                    'changed_paths': sorted(changed), 'scope': 'Affected harness checks only; independent review and full release remain held'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'workspace-evidence-reuse.json').write_text(json.dumps(result, indent=2))
          PYCODE
      - name: Acceptance checks remain active under optimized Python
        run: python -O -B -m unittest discover -s contrib/deepsignal/workspace/tests -p test_mcp_smoke.py -v
      - name: Actual Chromium against the exact committed bundle
        run: python -B -m contrib.deepsignal.workspace.browser_smoke --server-python "$(command -v python)"
      - name: Preserve workflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-fixture-evidence
          path: |
            ${{ runner.temp }}/workspace-dependencies.txt
            ${{ runner.temp }}/workspace-handoff.json
            ${{ runner.temp }}/workspace-evidence-reuse.json
          retention-days: 14
  existing-security-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          repository: eugenevivino/openrvdas
          ref: ce22f377f29c9bf5ba444a463d7a355c44adec61
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: desk
          ref: 460914c40ec02ddb8509be1994d5642174937469
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Evaluate unchanged approved policy, preserving any HOLD
        working-directory: product
        run: |
          python -m pip install bandit==1.9.4
          mkdir "$RUNNER_TEMP/workspace-scan"
          python -I -B ../desk/tools/fast-review/bandit-policy.py "$(command -v python)" "$PWD" ce22f377f29c9bf5ba444a463d7a355c44adec61 "$RUNNER_TEMP/workspace-scan"
      - name: Preserve raw scan and policy decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-security-evidence
          path: ${{ runner.temp }}/workspace-scan
          retention-days: 14
