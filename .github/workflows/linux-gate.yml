name: Linux gate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA from eugenevivino/openrvdas
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the desk
        id: desk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check out the public fork
        id: fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: eugenevivino/openrvdas
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          path: fork
          persist-credentials: false

      - name: Run the gate
        id: run_gate
        if: ${{ !cancelled() && steps.desk.outcome == 'success' }}
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          FORK_DIR: ${{ steps.fork.outcome == 'success' && 'fork' || '' }}
        run: |
          bash gate/gate-linux.sh "$REQUESTED_SHA" "$FORK_DIR" \
            "$RUNNER_TEMP/openrvdas-gate"

      - name: Upload gate evidence
        if: ${{ !cancelled() && steps.run_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-gate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/openrvdas-gate/*.tsv
            ${{ runner.temp }}/openrvdas-gate/*.log
            ${{ runner.temp }}/openrvdas-gate/*.txt
            ${{ runner.temp }}/openrvdas-gate/pytest.xml
            ${{ runner.temp }}/openrvdas-gate/receipt.json
